<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Request Management</title>
  <link rel="stylesheet" href="/index.css" />
  <link rel="stylesheet" href="/requests.css"/>
</head>
<body>
<div class="navBar">
  <div class="Username">Peter Kavinsky</div>
  <div class="nav butMakeItShorter">
    <button class="activeButton">Requests</button>
    <button>Log out</button>
  </div>
</div>
<div class="content">
  <form class="registerBox" method="post" action="/supplierRequests/editCardSave">
    <h1>Fill an order:</h1>
    <div class="form">
      <label>ID:</label>
      <div class="fakeInput" th:text="${(fillRequest != null)? fillRequest.requestId : ' '}"></div>
      <p>Product:</p>
      <div class="fakeInput" th:text="${(fillRequest != null)? fillRequest.product.name : ' '}"></div>
      <div>
        <p>Fill amount:</p>
        <div class="sameLineStuff">
          <input type="number" name="productAmount"/>
          <p th:text="'/' + ${(fillRequest != null)? fillRequest.amountToBeFilled : '0'}">/0</p>
        </div>
      </div>
      <div>
        <p>Expiry date:</p>
        <div class="sameLineStuff">
          <input type="date"/>
        </div>
      </div>
    </div>
    <button type="submit">Fill order</button>
  </form>
  <div class="infoBox">
    <form class="searchBox" action="/supplierRequests/SearchBox" method="post">
      <input type="number" id="searchRequestInput" name="idInput" placeholder="0"/>
      <button name="action" value="search">search</button>
      <button name="action" value="pending" th:classappend="${isPending? ' activeButton' : ''}">pending</button>
    </form>
    <div class="cardCatalog">
      <div class="requestCard supplierRequest" th:each="request : ${requests}" th:classappend="${request.isComplete()? ' completed' : ''}">
        <div class="horizontalStuff">
          <div class="marginRight">
            <p th:text="${request.product.name}">Kavum</p>
            <p>Amount</p>
          </div>
          <div>
            <p th:text="'ID: ' + ${request.requestId} + ' | Group: ' + ${request.firstRequestId}">(0294849580235)</p>
            <p th:text="': ' + ${request.isComplete() ? request.fullAmountRequested : request.amountToBeFilled}">: 80</p>
          </div>
        </div>
        <form method="post" action="/supplierRequests/editOrDelete">
          <input type="hidden" name="idOfCard" th:value="${request.requestId}"/>
          <button th:if="${request.isComplete == false}" name="action" value="fill">Fill</button>
          <button name="action" value="delete" th:if="${request.isComplete}">Delete</button>
        </form>
      </div>
    </div>
  </div>
</div>
</body>
</html>
