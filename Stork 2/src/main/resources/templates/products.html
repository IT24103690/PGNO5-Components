<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #5290AD; /* Blue background */
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .container {
            background-color: #6ba8c2; /* Lighter shade of blue */
            padding: 30px;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1, h2 {
            color: #ffffff;
            margin-bottom: 20px;
        }
        .content-section {
            background-color: #F7F7F7; /* White section */
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #5290AD; /* Blue for header */
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        tr:hover {
            background-color: #e8e8e8;
        }
        form {
            padding: 15px;
        }
        label {
            display: block;
            margin-bottom: 15px;
            color: #333;
        }
        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            max-width: 300px;
        }
        button {
            background-color: #AD6F52; /* Brown for buttons */
            color: white;
            border: none;
            padding: 8px 16px;
            margin-top: 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #8d5c45; /* Darker brown for hover */
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Products</h1>

    <div class="content-section">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}">ID</td>
                <td th:text="${product.name}">Name</td>
                <td th:text="${product.price}">Price</td>
            </tr>
            </tbody>
        </table>
    </div>

    <h2>Add Product</h2>
    <div class="content-section">
        <form th:action="@{/addProduct}" method="post">
            <label>ID: <input type="text" name="id" required></label>
            <label>Name: <input type="text" name="name" required></label>
            <label>Price: <input type="number" step="0.01" name="price" required></label>
            <button type="submit">Add</button>
        </form>
    </div>
</div>
</body>
</html>
