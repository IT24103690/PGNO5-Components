<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>
    <link th:href="@{/css/styles-users-list.css}" rel="stylesheet">
</head>
<body>
<!--@thymesVar id="users" type="java.util.List"-->
<!--@thymesVar id="selectedUser" type="com.inventory.inventorymanagement.model.User"-->
<div class="navBar">
    <div class="Username">Peter Kawinsky</div>
    <div class="nav">
        <button>Users</button>
        <button class="activeButton">Products</button>
        <button>Stocks</button>
        <button>Customers</button>
        <button>Orders</button>
        <button>Requests</button>
        <button>Log out</button>
    </div>
</div>
<div class="content">
    <div class="infoBox">
        <h1>User List</h1>
        <div th:if="${error}" class="error" th:text="${error}" style="color: red;"></div>
        <div class="cardCatalog">
            <div th:if="${users != null and not #lists.isEmpty(users)}">
                <div class="userCard" th:each="user : ${users}">
                    <p th:text="${user.name}"></p>
                    <p th:text="'ID: ' + ${user.id}"></p>
                    <p th:text="'Role: ' + ${user.role}"></p>
                    <div>
                        <button class="editBtn" th:onclick="'editUser(\'' + ${user.id} + '\')'">Edit</button>
                        <button class="deleteBtn" th:onclick="'deleteUser(\'' + ${user.id} + '\')'">Delete</button>
                    </div>
                </div>
            </div>
            <div th:if="${users == null or #lists.isEmpty(users)}">
                <p>No users found.</p>
            </div>
            <div class="userEditCard" id="editForm" style="display: none;">
                <form th:action="@{/users/update}" th:object="${selectedUser}" method="post" class="userEditCardInputs">
                    <label for="editName">Name:</label>
                    <input type="text" id="editName" th:field="*{name}" required>
                    <label for="editId">ID:</label>
                    <input type="text" id="editId" th:field="*{id}" readonly>
                    <div class="radio">
                        <p>Role:</p>
                        <div>
                            <input type="radio" id="editAdminRole" th:field="*{role}" th:value="admin" name="role" required>
                            <label for="editAdminRole">Admin</label>
                        </div>
                        <div>
                            <input type="radio" id="editStaffRole" th:field="*{role}" th:value="staff" name="role">
                            <label for="editStaffRole">Staff</label>
                        </div>
                        <div>
                            <input type="radio" id="editSupplierRole" th:field="*{role}" th:value="supplier" name="role">
                            <label for="editSupplierRole">Supplier</label>
                        </div>
                    </div>
                    <label for="editPassword">Password:</label>
                    <input type="password" id="editPassword" th:field="*{password}" required>
                    <button type="submit">Update User</button>
                </form>
                <button class="cancelBtn" onclick="cancelEdit()">Cancel</button>
            </div>
        </div>
    </div>
</div>
<script th:inline="javascript">
    function editUser(userId) {
        fetch('/users/' + userId)
            .then(response => response.json())
            .then(user => {
                if (user) {
                    document.getElementById('editForm').style.display = 'flex';
                    document.getElementById('editName').value = user.name || '';
                    document.getElementById('editId').value = user.id || '';
                    const roleRadio = document.querySelector(`input[id^="edit"][value="${user.role}"]`);
                    if (roleRadio) roleRadio.checked = true;
                    document.getElementById('editPassword').value = user.password || '';
                } else {
                    console.error('User not found');
                }
            })
            .catch(error => console.error('Error fetching user:', error));
    }

    function deleteUser(userId) {
        if (confirm('Are you sure you want to delete this user?')) {
            fetch('/users/' + userId, { method: 'DELETE' })
                .then(() => location.reload())
                .catch(error => console.error('Error deleting user:', error));
        }
    }

    function cancelEdit() {
        document.getElementById('editForm').style.display = 'none';
    }

    document.querySelector('form.userEditCardInputs').addEventListener('submit', function(event) {
        event.preventDefault();
        fetch('/users/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                id: document.getElementById('editId').value,
                name: document.getElementById('editName').value,
                role: document.querySelector('input[name="role"]:checked').value,
                password: document.getElementById('editPassword').value
            })
        })
            .then(response => {
                if (response.ok) location.reload();
                else console.error('Update failed');
            })
            .catch(error => console.error('Error updating user:', error));
    });
</script>
</body>
</html>
