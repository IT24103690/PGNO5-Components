<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>
    <link th:href="@{/css/styles-users-list.css}" rel="stylesheet">
    <style>
        .cancelBtn {
            padding: 10px 20px; /* Increase padding for a larger button */
            font-size: 16px; /* Adjust font size for better readability */
            background-color: #f44336; /* Red background to match the delete button theme */
            color: white; /* White text for contrast */
            border: none; /* Remove default border */
            border-radius: 5px; /* Rounded corners for a modern look */
            cursor: pointer; /* Hand cursor on hover */
            transition: background-color 0.3s; /* Smooth transition for hover effect */
        }

        .cancelBtn:hover {
            background-color: #d32f2f; /* Darker red on hover for interactivity */
        }
    </style>
</head>
<body>
<!--@thymesVar id="users" type="java.util.List"-->
<!--@thymesVar id="selectedUser" type="com.inventory.inventorymanagement.model.User"-->
<div class="navBar">
    <div class="Username">Peter Kawinsky</div>
    <div class="nav">
        <button onclick="window.location.href='/users/dashboard'">Back to Dashboard</button>
        <button class="activeButton">Users</button>
        <button onclick="window.location.href='/products'">Products</button>
        <button onclick="window.location.href='/stocks'">Stocks</button>
        <button onclick="window.location.href='/orders'">Orders</button>
        <button onclick="window.location.href='/logout'">Log out</button>
    </div>
</div>
<div class="content">
    <div class="infoBox">
        <h1>User List</h1>
        <div th:if="${error}" class="error" th:text="${error}" style="color: red;"></div>
        <div class="cardCatalog">
            <div th:if="${users != null and not #lists.isEmpty(users)}">
                <div class="userCard" th:each="user : ${users}">
                    <p th:text="'Name: ' + ${user.name}"></p>
                    <p th:text="'ID: ' + ${user.id}"></p>
                    <p th:text="'Role: ' + ${user.role}"></p>
                    <p th:if="${user.role == 'admin'}" th:text="'Admin Level: ' + ${user.adminLevel}"></p>
                    <p th:if="${user.role == 'staff'}" th:text="'Department: ' + ${user.department}"></p>
                    <p th:if="${user.role == 'supplier'}" th:text="'Company Name: ' + ${user.companyName}"></p>
                    <div>
                        <button class="editBtn" th:attr="data-id=${user.id}" onclick="editUser(this)">Edit</button>
                        <button class="deleteBtn" th:attr="data-id=${user.id}" onclick="deleteUser(this)">Delete</button>
                    </div>
                </div>
            </div>
            <div th:if="${users == null or #lists.isEmpty(users)}">
                <p>No users found.</p>
            </div>
            <div class="userEditCard" id="editForm" style="display: none;">
                <form th:action="@{/users/update}" th:object="${selectedUser}" method="post" class="userEditCardInputs">
                    <input type="hidden" id="originalId" name="originalId">
                    <label for="editId">ID:</label>
                    <input type="text" id="editId" th:field="*{id}">
                    <label for="editName">Name:</label>
                    <input type="text" id="editName" th:field="*{name}" required>
                    <div class="radio">
                        <p>Role:</p>
                        <div>
                            <input type="radio" id="editAdminRole" th:field="*{role}" th:value="admin" name="role" required>
                            <label for="editAdminRole">Admin</label>
                        </div>
                        <div>
                            <input type="radio" id="editStaffRole" th:field="*{role}" th:value="staff" name="role">
                            <label for="editStaffRole">Staff</label>
                        </div>
                        <div>
                            <input type="radio" id="editSupplierRole" th:field="*{role}" th:value="supplier" name="role">
                            <label for="editSupplierRole">Supplier</label>
                        </div>
                    </div>
                    <label for="editAdminLevel" th:if="${selectedUser.role == 'admin'}">Admin Level:</label>
                    <input type="text" id="editAdminLevel" th:field="*{adminLevel}" name="adminLevel" th:if="${selectedUser.role == 'admin'}">
                    <label for="editDepartment" th:if="${selectedUser.role == 'staff'}">Department:</label>
                    <input type="text" id="editDepartment" th:field="*{department}" name="department" th:if="${selectedUser.role == 'staff'}">
                    <label for="editCompanyName" th:if="${selectedUser.role == 'supplier'}">Company Name:</label>
                    <input type="text" id="editCompanyName" th:field="*{companyName}" name="companyName" th:if="${selectedUser.role == 'supplier'}">
                    <label for="editPassword">New Password (optional):</label>
                    <div class="passwordContainer">
                        <input type="password" id="editPassword" th:field="*{password}" placeholder="Enter new password">
                        <span class="togglePassword" onclick="togglePassword()">👁️</span>
                    </div>
                    <button type="submit">Update User</button>
                </form>
                <button class="cancelBtn" onclick="cancelEdit()">Cancel</button>
            </div>
        </div>
    </div>
</div>
<script th:inline="javascript">
    let originalId = '';

    function editUser(button) {
        const userId = button.getAttribute('data-id');
        originalId = userId; // Store the original ID
        fetch('/users/' + userId)
            .then(response => response.json())
            .then(user => {
                if (user) {
                    document.getElementById('editForm').style.display = 'flex';
                    document.getElementById('originalId').value = userId;
                    document.getElementById('editId').value = user.id || '';
                    document.getElementById('editName').value = user.name || '';
                    const roleRadio = document.querySelector(`input[id^="edit"][value="${user.role}"]`);
                    if (roleRadio) roleRadio.checked = true;
                    const adminLevelInput = document.getElementById('editAdminLevel');
                    const departmentInput = document.getElementById('editDepartment');
                    const companyNameInput = document.getElementById('editCompanyName');
                    if (adminLevelInput) adminLevelInput.value = user.adminLevel || '';
                    if (departmentInput) departmentInput.value = user.department || '';
                    if (companyNameInput) companyNameInput.value = user.companyName || '';
                    document.getElementById('editPassword').value = ''; // Clear password field
                } else {
                    console.error('User not found');
                }
            })
            .catch(error => console.error('Error fetching user:', error));
    }

    function togglePassword() {
        const passwordInput = document.getElementById('editPassword');
        const toggleIcon = document.querySelector('.togglePassword');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.textContent = '👁️‍🗨️';
        } else {
            passwordInput.type = 'password';
            toggleIcon.textContent = '👁️';
        }
    }

    function deleteUser(button) {
        const userId = button.getAttribute('data-id');
        if (confirm('Are you sure you want to delete this user?')) {
            fetch('/users/' + userId, { method: 'DELETE' })
                .then(response => {
                    if (response.ok) {
                        location.reload();
                    } else {
                        alert('Failed to delete user. Please try again.');
                        console.error('Delete failed');
                    }
                })
                .catch(error => {
                    alert('Error deleting user: ' + error.message);
                    console.error('Error deleting user:', error);
                });
        }
    }

    function cancelEdit() {
        document.getElementById('editForm').style.display = 'none';
    }

    document.querySelector('form.userEditCardInputs').addEventListener('submit', function(event) {
        event.preventDefault();
        const userData = {
            id: document.getElementById('editId').value,
            name: document.getElementById('editName').value,
            role: document.querySelector('input[name="role"]:checked').value,
            password: document.getElementById('editPassword').value,
            adminLevel: document.getElementById('editAdminLevel') ? document.getElementById('editAdminLevel').value : null,
            department: document.getElementById('editDepartment') ? document.getElementById('editDepartment').value : null,
            companyName: document.getElementById('editCompanyName') ? document.getElementById('editCompanyName').value : null
        };
        const formData = {
            user: userData,
            originalId: document.getElementById('originalId').value
        };
        console.log('Sending update request:', JSON.stringify(formData));
        fetch('/users/update', {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData)
        })
            .then(response => {
                if (response.ok) location.reload();
                else {
                    response.text().then(text => {
                        alert("Failed to update user: " + text);
                        console.error("Update failed:", text);
                    });
                }
            })
            .catch(error => {
                alert("Error updating user: " + error.message);
                console.error("Error updating user:", error);
            });
    });
</script>
</body>
</html>
