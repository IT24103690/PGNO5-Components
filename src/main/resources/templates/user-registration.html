<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<div class="navBar">
    <div class="Username">Peter Kawinsky</div>
    <div class="nav">
        <button onclick="window.location.href='/users/dashboard'">Back to Dashboard</button>
        <button onclick="window.location.href='/users'">Users</button>
        <button onclick="window.location.href='/products'">Products</button>
        <button onclick="window.location.href='/stocks'">Stocks</button>
        <button onclick="window.location.href='/order/dashboard'">Orders</button>
        <button onclick="window.location.href='/logout'">Log out</button>
    </div>
</div>
<div class="content">
    <div class="registerBox">
        <h1>Register a new user</h1>
        <div th:if="${error}" class="error" th:text="${error}" style="color: red;"></div>
        <form th:action="@{/users/register}" th:object="${user}" method="post" class="form">
            <label for="id">ID (optional, auto-generated if blank):</label>
            <input type="text" id="id" th:field="*{id}" name="id">
            <label for="name">Name:</label>
            <input type="text" id="name" th:field="*{name}" name="name" required>
            <div class="radio">
                <p>Role:</p>
                <div>
                    <input type="radio" id="adminRole" th:field="*{role}" th:value="admin" name="role" required>
                    <label for="adminRole">Admin</label>
                </div>
                <div>
                    <input type="radio" id="staffRole" th:field="*{role}" th:value="staff" name="role">
                    <label for="staffRole">Staff</label>
                </div>
                <div>
                    <input type="radio" id="supplierRole" th:field="*{role}" th:value="supplier" name="role">
                    <label for="supplierRole">Supplier</label>
                </div>
            </div>
            <label for="password">Password:</label>
            <input type="password" id="password" th:field="*{password}" name="password" required>
            <label for="adminLevel" th:if="${user.role == 'admin'}">Admin Level:</label>
            <input type="text" id="adminLevel" th:field="*{adminLevel}" name="adminLevel" th:if="${user.role == 'admin'}">
            <label for="companyName" th:if="${user.role == 'supplier'}">Company Name:</label>
            <input type="text" id="companyName" th:field="*{companyName}" name="companyName" th:if="${user.role == 'supplier'}">
            <label for="department" th:if="${user.role == 'staff'}">Department:</label>
            <input type="text" id="department" th:field="*{department}" name="department" th:if="${user.role == 'staff'}">
            <button type="submit" id="createUserBtn">Create user</button>
        </form>
    </div>
</div>
</body>
</html>
